name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/watchline-hermes-plugin/
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install build pytest ruff twine
      - run: ruff check .
      - run: python -m compileall -q watchline_hermes_plugin __init__.py
      - run: python -m pytest --import-mode=importlib tests
      - run: python -m build
      - run: python -m twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
